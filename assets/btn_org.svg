<svg width="100%" height="auto" viewBox="0 0 425 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="btnGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .btn-cat { font-family: 'Fira Code', monospace; font-size: 9.5px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.5px; }
      .btn-url { font-family: 'Fira Code', monospace; font-size: 10px; fill: #94a3b8; }

      /* Laser Sequencial: Janela 40% a 60% (3.0s a 4.5s) */
      @keyframes laserSweep3 {
        0%, 40% { stroke-dashoffset: 954; opacity: 0; }
        42% { opacity: 1; }
        58% { opacity: 1; }
        60% { stroke-dashoffset: 0; opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .laser-beam {
        stroke-dasharray: 140 814;
        animation: laserSweep3 7.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Card Static Border -->
  <rect x="1" y="1" width="423" height="54" rx="12" fill="#032541" fill-opacity="0.4" stroke="#0284c7" stroke-opacity="0.25" stroke-width="1.2" />
  
  <!-- Laser Neon Traveling Beam (Passo 3 do ciclo) -->
  <rect x="1" y="1" width="423" height="54" rx="12" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" class="laser-beam" filter="url(#btnGlow3)" />

  <!-- Icon Box -->
  <g transform="translate(14, 11)">
    <rect width="34" height="34" rx="9" fill="#082f49" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1" />
    <rect x="9" y="8" width="16" height="18" rx="2" stroke="#38bdf8" stroke-width="1.3" fill="none" />
    <rect x="12" y="12" width="3" height="3" fill="#38bdf8" />
    <rect x="19" y="12" width="3" height="3" fill="#38bdf8" />
    <rect x="12" y="18" width="3" height="3" fill="#38bdf8" />
    <rect x="19" y="18" width="3" height="3" fill="#38bdf8" />
  </g>

  <!-- Texts -->
  <text x="58" y="24" class="btn-cat">ORGANIZAÇÃO OFICIAL ↗</text>
  <text x="58" y="42" class="btn-url">github.com/WebuildSoft • 15+ Repos</text>

  <!-- Right Pill -->
  <g transform="translate(330, 18)">
    <rect width="81" height="20" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="40.5" y="13.5" font-family="'Fira Code', monospace" font-size="8.5" fill="#bae6fd" font-weight="700" text-anchor="middle">ORGANIZAÇÃO</text>
  </g>
</svg>
