<svg width="100%" height="auto" viewBox="0 0 420 146" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8b949e; }
      .tag-txt { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 600; fill: #67e8f9; }
      .category { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #22d3ee; letter-spacing: 0.5px; }
      .arrow { font-family: 'Fira Code', monospace; font-size: 12px; fill: #22d3ee; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="417" height="143" rx="14" fill="#0c0f17" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Ambient Light -->
  <circle cx="390" cy="25" r="40" fill="#06b6d4" fill-opacity="0.08" filter="url(#cyanGlow)" />

  <!-- Vector Browser Window Icon -->
  <rect x="20" y="18" width="26" height="26" rx="6" fill="#083344" fill-opacity="0.7" stroke="#06b6d4" stroke-opacity="0.5" />
  <rect x="24" y="24" width="18" height="14" rx="2" stroke="#22d3ee" stroke-width="1.4" fill="none" />
  <line x1="24" y1="28" x2="42" y2="28" stroke="#22d3ee" stroke-width="1.2" />
  <circle cx="27" cy="26" r="0.8" fill="#22d3ee" />
  <circle cx="30" cy="26" r="0.8" fill="#22d3ee" />

  <text x="54" y="30" class="category">PLATAFORMA WEB</text>
  <text x="54" y="42" class="arrow">webuildsites.com.br ↗</text>

  <!-- Title -->
  <text x="20" y="70" class="card-title">WebuildSites • Criação de Sites</text>

  <!-- Description -->
  <text x="20" y="90" class="card-desc">Plataforma para criação, publicação e gestão de websites</text>
  <text x="20" y="105" class="card-desc">de alta conversão, hospedado em produção na Vercel.</text>

  <!-- Chips -->
  <g transform="translate(20, 116)">
    <rect width="66" height="20" rx="5" fill="#083344" fill-opacity="0.5" stroke="#06b6d4" stroke-opacity="0.3" />
    <text x="33" y="13.5" text-anchor="middle" class="tag-txt">Next.js</text>
  </g>
  <g transform="translate(92, 116)">
    <rect width="78" height="20" rx="5" fill="#083344" fill-opacity="0.5" stroke="#06b6d4" stroke-opacity="0.3" />
    <text x="39" y="13.5" text-anchor="middle" class="tag-txt">TypeScript</text>
  </g>
  <g transform="translate(176, 116)">
    <rect width="66" height="20" rx="5" fill="#083344" fill-opacity="0.5" stroke="#06b6d4" stroke-opacity="0.3" />
    <text x="33" y="13.5" text-anchor="middle" class="tag-txt">Vercel</text>
  </g>
</svg>
