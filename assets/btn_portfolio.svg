<svg width="100%" height="auto" viewBox="0 0 425 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="btnGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .btn-cat { font-family: 'Fira Code', monospace; font-size: 9.5px; font-weight: 700; fill: #22d3ee; letter-spacing: 0.5px; }
      .btn-url { font-family: 'Fira Code', monospace; font-size: 10px; fill: #94a3b8; }
      
      /* Laser Sequencial: Janela 0% a 20% (0s a 1.5s) */
      @keyframes laserSweep1 {
        0% { stroke-dashoffset: 954; opacity: 0; }
        2% { opacity: 1; }
        18% { opacity: 1; }
        20% { stroke-dashoffset: 0; opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .laser-beam {
        stroke-dasharray: 140 814;
        animation: laserSweep1 7.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Card Static Border -->
  <rect x="1" y="1" width="423" height="54" rx="12" fill="#081e2b" fill-opacity="0.45" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1.2" />
  
  <!-- Laser Neon Traveling Beam (Passo 1 do ciclo) -->
  <rect x="1" y="1" width="423" height="54" rx="12" fill="none" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" class="laser-beam" filter="url(#btnGlow1)" />

  <!-- Icon Box -->
  <g transform="translate(14, 11)">
    <rect width="34" height="34" rx="9" fill="#002b3d" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="17" cy="17" r="8" stroke="#22d3ee" stroke-width="1.3" fill="none" />
    <line x1="9" y1="17" x2="25" y2="17" stroke="#22d3ee" stroke-width="1.1" />
    <ellipse cx="17" cy="17" rx="4" ry="8" stroke="#22d3ee" stroke-width="1.1" fill="none" />
  </g>

  <!-- Texts -->
  <text x="58" y="24" class="btn-cat">PORTFÓLIO LIVE ↗</text>
  <text x="58" y="42" class="btn-url">helenilsoon.github.io/portifolio</text>

  <!-- Right Pill -->
  <g transform="translate(345, 18)">
    <rect width="66" height="20" rx="6" fill="#022c22" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="10" cy="10" r="3" fill="#10b981" />
    <text x="36" y="13.5" font-family="'Fira Code', monospace" font-size="8.5" fill="#34d399" font-weight="700" text-anchor="middle">ONLINE</text>
  </g>
</svg>
