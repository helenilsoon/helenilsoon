<svg width="100%" height="auto" viewBox="0 0 340 76" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .track-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
      .track-sub { font-family: 'Fira Code', monospace; font-size: 10px; fill: #8b949e; }
      .tag-text { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 600; fill: #34d399; }
      @keyframes eqBar1 { 0%, 100% { height: 4px; y: 16px; } 50% { height: 16px; y: 4px; } }
      @keyframes eqBar2 { 0%, 100% { height: 6px; y: 14px; } 50% { height: 18px; y: 2px; } }
      @keyframes eqBar3 { 0%, 100% { height: 4px; y: 16px; } 50% { height: 12px; y: 8px; } }
      @keyframes eqBar4 { 0%, 100% { height: 5px; y: 15px; } 50% { height: 15px; y: 5px; } }
      .b1 { animation: eqBar1 0.8s ease-in-out infinite; }
      .b2 { animation: eqBar2 1.1s ease-in-out infinite 0.2s; }
      .b3 { animation: eqBar3 0.7s ease-in-out infinite 0.4s; }
      .b4 { animation: eqBar4 0.9s ease-in-out infinite 0.1s; }
    </style>
  </defs>

  <rect width="340" height="76" rx="12" fill="#07090e" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" />

  <!-- Animated Equalizer bars -->
  <g transform="translate(14, 10)">
    <rect x="0" y="16" width="2" height="4" rx="1" fill="#10b981" class="b1" />
    <rect x="4" y="14" width="2" height="6" rx="1" fill="#10b981" class="b2" />
    <rect x="8" y="16" width="2" height="4" rx="1" fill="#10b981" class="b3" />
    <rect x="12" y="15" width="2" height="5" rx="1" fill="#10b981" class="b4" />
  </g>
  <text x="36" y="24" class="tag-text">Coding Soundtrack • Spotify</text>

  <!-- Spotify Logo Icon Box -->
  <rect x="14" y="34" width="30" height="30" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-opacity="0.4" />
  <path d="M29 42C24.6 42 21 45.6 21 50C21 54.4 24.6 58 29 58C33.4 58 37 54.4 37 50C37 45.6 33.4 42 29 42ZM32.68 53.56C32.52 53.8 32.24 53.88 32 53.72C30.12 52.56 27.76 52.32 24.96 52.96C24.68 53.04 24.44 52.84 24.36 52.6C24.28 52.32 24.48 52.08 24.72 52C27.76 51.32 30.4 51.6 32.48 52.88C32.76 53 32.8 53.32 32.68 53.56Z" fill="#34d399" />

  <!-- Track Info -->
  <text x="54" y="47" class="track-title">Lo-Fi &amp; Synthwave Beats</text>
  <text x="54" y="60" class="track-sub">Deep Focus &amp; Flow Session</text>
</svg>
