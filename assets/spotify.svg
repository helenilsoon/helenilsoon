<svg width="100%" height="auto" viewBox="0 0 340 88" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="spotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="spotBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.3" />
    </linearGradient>
    <style>
      .track-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
      .track-sub { font-family: 'Fira Code', monospace; font-size: 9.5px; fill: #94a3b8; }
      .tag-text { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 700; fill: #34d399; letter-spacing: 0.5px; }
      @keyframes eqBar1 { 0%, 100% { height: 4px; y: 16px; } 50% { height: 16px; y: 4px; } }
      @keyframes eqBar2 { 0%, 100% { height: 6px; y: 14px; } 50% { height: 19px; y: 1px; } }
      @keyframes eqBar3 { 0%, 100% { height: 4px; y: 16px; } 50% { height: 13px; y: 7px; } }
      @keyframes eqBar4 { 0%, 100% { height: 5px; y: 15px; } 50% { height: 17px; y: 3px; } }
      .b1 { animation: eqBar1 0.8s ease-in-out infinite; }
      .b2 { animation: eqBar2 1.1s ease-in-out infinite 0.2s; }
      .b3 { animation: eqBar3 0.7s ease-in-out infinite 0.4s; }
      .b4 { animation: eqBar4 0.9s ease-in-out infinite 0.1s; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="338" height="86" rx="12" fill="#06090e" stroke="url(#spotBorder)" stroke-width="1.3" />
  <circle cx="310" cy="20" r="30" fill="#10b981" fill-opacity="0.08" filter="url(#spotGlow)" />

  <!-- Top Line: Equalizer + Tag -->
  <g transform="translate(16, 12)">
    <!-- Animated Equalizer Bars -->
    <rect x="0" y="15" width="2" height="5" rx="1" fill="#10b981" class="b1" />
    <rect x="4" y="13" width="2" height="7" rx="1" fill="#10b981" class="b2" />
    <rect x="8" y="15" width="2" height="5" rx="1" fill="#10b981" class="b3" />
    <rect x="12" y="14" width="2" height="6" rx="1" fill="#10b981" class="b4" />
    <text x="24" y="18" class="tag-text">CODING SOUNDTRACK • SPOTIFY</text>
  </g>

  <!-- Album / Spotify Art Icon Box -->
  <g transform="translate(16, 38)">
    <rect width="36" height="36" rx="9" fill="#042f2e" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
    <path d="M18 10C13.58 10 10 13.58 10 18C10 22.42 13.58 26 18 26C22.42 26 26 22.42 26 18C26 13.58 22.42 10 18 10ZM21.68 21.56C21.52 21.8 21.24 21.88 21 21.72C19.12 20.56 16.76 20.32 13.96 20.96C13.68 21.04 13.44 20.84 13.36 20.6C13.28 20.32 13.48 20.08 13.72 20C16.76 19.32 19.4 19.6 21.48 20.88C21.76 21 21.8 21.32 21.68 21.56ZM22.68 19.4C22.48 19.72 22.08 19.84 21.76 19.64C19.6 18.32 16.28 17.92 13.44 18.8C13.08 18.92 12.68 18.72 12.56 18.36C12.44 18 12.64 17.6 13 17.48C16.2 16.52 19.88 16.96 22.44 18.52C22.76 18.68 22.84 19.12 22.68 19.4Z" fill="#34d399" />
  </g>

  <!-- Track Details -->
  <text x="62" y="52" class="track-title">Cyberpunk Lo-Fi &amp; Synthwave</text>
  <text x="62" y="67" class="track-sub">Deep Focus Flow Session</text>
</svg>
