<svg width="100%" height="auto" viewBox="0 0 420 146" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="fuchsiaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8b949e; }
      .tag-txt { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 600; fill: #f5d0fe; }
      .category { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #e879f9; letter-spacing: 0.5px; }
      .arrow { font-family: 'Fira Code', monospace; font-size: 12px; fill: #e879f9; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="417" height="143" rx="14" fill="#0c0f17" stroke="#d946ef" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Ambient Light -->
  <circle cx="390" cy="25" r="40" fill="#d946ef" fill-opacity="0.08" filter="url(#fuchsiaGlow)" />

  <!-- Vector Shopping Bag Icon -->
  <rect x="20" y="18" width="26" height="26" rx="6" fill="#701a75" fill-opacity="0.7" stroke="#d946ef" stroke-opacity="0.5" />
  <rect x="25" y="26" width="16" height="13" rx="2" stroke="#f472b6" stroke-width="1.4" fill="none" />
  <path d="M29 26V23C29 21.9 29.9 21 31 21H35C36.1 21 37 21.9 37 23V26" stroke="#f472b6" stroke-width="1.4" />

  <text x="54" y="30" class="category">E-COMMERCE &amp; STORE</text>
  <text x="54" y="42" class="arrow">lenamimos.com.br ↗</text>

  <!-- Title -->
  <text x="20" y="70" class="card-title">Lena Mimos • Loja Virtual</text>

  <!-- Description -->
  <text x="20" y="90" class="card-desc">Loja virtual com checkout transparente Pix via Mercado Pago,</text>
  <text x="20" y="105" class="card-desc">Cloudflare R2 Storage e cálculo dinâmico de frete.</text>

  <!-- Chips -->
  <g transform="translate(20, 116)">
    <rect width="66" height="20" rx="5" fill="#701a75" fill-opacity="0.5" stroke="#d946ef" stroke-opacity="0.3" />
    <text x="33" y="13.5" text-anchor="middle" class="tag-txt">Next.js</text>
  </g>
  <g transform="translate(92, 116)">
    <rect width="90" height="20" rx="5" fill="#701a75" fill-opacity="0.5" stroke="#d946ef" stroke-opacity="0.3" />
    <text x="45" y="13.5" text-anchor="middle" class="tag-txt">Mercado Pago</text>
  </g>
  <g transform="translate(188, 116)">
    <rect width="86" height="20" rx="5" fill="#701a75" fill-opacity="0.5" stroke="#d946ef" stroke-opacity="0.3" />
    <text x="43" y="13.5" text-anchor="middle" class="tag-txt">Cloudflare R2</text>
  </g>
</svg>
