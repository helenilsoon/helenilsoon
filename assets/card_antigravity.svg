<svg width="100%" height="auto" viewBox="0 0 860 126" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="fuchsiaCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.5" />
    </linearGradient>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #8b949e; }
      .tag-txt { font-family: 'Fira Code', monospace; font-size: 9.5px; font-weight: 600; fill: #67e8f9; }
      .category { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #22d3ee; letter-spacing: 0.5px; }
      .arrow { font-family: 'Fira Code', monospace; font-size: 12px; fill: #f472b6; font-weight: bold; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="857" height="123" rx="14" fill="#0c0f17" stroke="url(#cardGrad)" stroke-width="1.5" />
  <circle cx="820" cy="30" r="50" fill="#d946ef" fill-opacity="0.08" filter="url(#fuchsiaCyanGlow)" />

  <!-- Vector Mobile Device / Chip Icon -->
  <rect x="24" y="20" width="30" height="30" rx="8" fill="#083344" stroke="#06b6d4" stroke-opacity="0.5" />
  <rect x="31" y="26" width="16" height="18" rx="2" stroke="#22d3ee" stroke-width="1.5" fill="none" />
  <circle cx="39" cy="40" r="1" fill="#22d3ee" />

  <text x="64" y="32" class="category">OPEN SOURCE ECOSYSTEM • WEBUILDSOFT</text>
  <text x="64" y="45" class="arrow">Download Releases v1.4.1 (Android, Windows, macOS, Linux) ↗</text>

  <!-- Title -->
  <text x="24" y="74" class="card-title">Antigravity Mobile &amp; Companion Server</text>

  <!-- Description -->
  <text x="24" y="93" class="card-desc">Companion client mobile em Flutter (Android) e servidor de alta performance em Go 1.24 com WebSockets e túneis Cloudflare Zero Trust.</text>

  <!-- Chips -->
  <g transform="translate(620, 20)">
    <rect width="90" height="22" rx="6" fill="#083344" fill-opacity="0.6" stroke="#06b6d4" stroke-opacity="0.4" />
    <text x="45" y="15" text-anchor="middle" class="tag-txt">Go 1.24</text>
  </g>
  <g transform="translate(720, 20)">
    <rect width="110" height="22" rx="6" fill="#701a75" fill-opacity="0.6" stroke="#d946ef" stroke-opacity="0.4" />
    <text x="55" y="15" text-anchor="middle" class="tag-txt" fill="#f472b6">Flutter Client</text>
  </g>
</svg>
