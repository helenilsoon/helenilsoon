<svg width="100%" height="auto" viewBox="0 0 860 126" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="fuchsiaCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.8" />
    </linearGradient>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #94a3b8; }
      .tag-txt { font-family: 'Fira Code', monospace; font-size: 9.5px; font-weight: 600; fill: #67e8f9; }
      .category { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #00f0ff; letter-spacing: 0.5px; }
      .arrow { font-family: 'Fira Code', monospace; font-size: 11.5px; fill: #f472b6; font-weight: bold; }

      @keyframes float3D {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(1.5deg); }
      }
      @keyframes spin3D {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .holo-device {
        animation: float3D 3.8s ease-in-out infinite;
        transform-origin: 790px 62px;
      }
      .spin-ring {
        animation: spin3D 8s linear infinite;
        transform-origin: 790px 62px;
      }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="857" height="123" rx="14" fill="#080c14" stroke="url(#cardGrad)" stroke-width="1.4" />
  <circle cx="790" cy="62" r="45" fill="#d946ef" fill-opacity="0.08" filter="url(#fuchsiaCyanGlow)" />

  <!-- Vector Mobile Device / Chip Icon Left -->
  <rect x="24" y="20" width="30" height="30" rx="8" fill="#083344" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.2" />
  <rect x="31" y="26" width="16" height="18" rx="2" stroke="#22d3ee" stroke-width="1.5" fill="none" />
  <circle cx="39" cy="40" r="1" fill="#22d3ee" />

  <text x="64" y="32" class="category">OPEN SOURCE ECOSYSTEM • WEBUILDSOFT</text>
  <text x="64" y="45" class="arrow">Download Releases v1.4.1 (Android, Windows, macOS, Linux) ↗</text>

  <!-- Title -->
  <text x="24" y="74" class="card-title">Antigravity Mobile &amp; Companion Server</text>

  <!-- Description -->
  <text x="24" y="93" class="card-desc">Companion client mobile em Flutter (Android) e servidor de alta performance em Go 1.24 com WebSockets e túneis Cloudflare Zero Trust.</text>

  <!-- Chips Top Right -->
  <g transform="translate(530, 20)">
    <rect width="86" height="22" rx="6" fill="#083344" fill-opacity="0.6" stroke="#00f0ff" stroke-opacity="0.4" />
    <text x="43" y="15" text-anchor="middle" class="tag-txt">Go 1.24</text>
  </g>
  <g transform="translate(626, 20)">
    <rect width="100" height="22" rx="6" fill="#701a75" fill-opacity="0.6" stroke="#d946ef" stroke-opacity="0.4" />
    <text x="50" y="15" text-anchor="middle" class="tag-txt" fill="#f472b6">Flutter Client</text>
  </g>

  <!-- ================= 3D HOLOGRAPHIC SMARTPHONE / CLIENT DEVICE (FAR RIGHT) ================= -->
  <!-- Anel Orbital 3D -->
  <g class="spin-ring">
    <ellipse cx="790" cy="62" rx="42" ry="15" stroke="#00f0ff" stroke-width="1.1" stroke-dasharray="6 4 2 4" stroke-opacity="0.6" fill="none" filter="url(#fuchsiaCyanGlow)" />
    <circle cx="832" cy="62" r="2.5" fill="#d946ef" />
  </g>

  <!-- Smartphone Isométrico 3D Flutuante -->
  <g class="holo-device">
    <!-- Base Traseira 3D -->
    <polygon points="790,38 812,50 790,62 768,50" fill="#032541" stroke="#00f0ff" stroke-width="1.2" />
    <polygon points="768,50 790,62 790,82 768,70" fill="#021526" stroke="#00f0ff" stroke-width="1.1" />
    <polygon points="790,62 812,50 812,70 790,82" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.1" />

    <!-- Camada Elevada (Tela Holográfica do App) -->
    <polygon points="790,30 810,41 790,52 770,41" fill="#701a75" fill-opacity="0.75" stroke="#f472b6" stroke-width="1.1" />
    <circle cx="790" cy="41" r="3" fill="#00f0ff" filter="url(#fuchsiaCyanGlow)" />
  </g>
</svg>
