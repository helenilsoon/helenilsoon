<svg width="100%" height="auto" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#99f6e4" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0c101a" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 38px;
        letter-spacing: -0.5px;
      }
      .mono-text {
        font-family: 'Fira Code', 'Courier New', Courier, monospace;
      }
      .badge-text {
        font-size: 11px;
        font-weight: 600;
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .pulse {
        animation: pulseDot 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background Base Container -->
  <rect x="2" y="2" width="896" height="256" rx="16" fill="url(#bgDark)" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="830" cy="40" r="90" fill="#06b6d4" fill-opacity="0.12" filter="url(#cyanGlow)" />
  <circle cx="70" cy="220" r="80" fill="#d946ef" fill-opacity="0.08" filter="url(#cyanGlow)" />

  <!-- TOP BAR: Status & Location -->
  <!-- Status Badge Container -->
  <rect x="36" y="28" width="280" height="26" rx="13" fill="#083344" fill-opacity="0.7" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="50" cy="41" r="4.5" fill="#22d3ee" class="pulse" />
  <text x="63" y="45" fill="#67e8f9" class="mono-text badge-text">STATUS: SYSTEM ONLINE • READY TO BUILD</text>

  <!-- Location Badge -->
  <text x="864" y="45" fill="#f472b6" class="mono-text badge-text" text-anchor="end">MANAUS, BR (GMT-4)</text>

  <!-- HERO TITLE -->
  <text x="36" y="105" fill="url(#neonGradient)" class="title-text">HELENILSON OLIVEIRA</text>

  <!-- Subtitle -->
  <text x="36" y="132" fill="#67e8f9" class="mono-text" font-size="13" font-weight="600">&gt; FULL STACK SOFTWARE DEVELOPER • WEB ARCHITECT</text>

  <!-- Short Bio -->
  <text x="36" y="156" fill="#8b949e" class="mono-text" font-size="12">Construindo soluções web escaláveis, sistemas digitais e ecossistemas de alta performance.</text>

  <!-- BOTTOM STATS CHIPS (4 Column Grid) -->
  <!-- Chip 1: Organization -->
  <g transform="translate(36, 178)">
    <rect width="195" height="54" rx="10" fill="#000000" fill-opacity="0.6" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />
    <path d="M14 18V38H30V18H14ZM26 34H18V22H26V34Z" fill="#22d3ee" />
    <text x="36" y="24" fill="#22d3ee" class="mono-text" font-size="9" font-weight="bold">ORGANIZAÇÃO</text>
    <text x="36" y="41" fill="#ffffff" class="mono-text" font-size="12" font-weight="bold">@WebuildSoft ↗</text>
  </g>

  <!-- Chip 2: Repositories -->
  <g transform="translate(245, 178)">
    <rect width="195" height="54" rx="10" fill="#000000" fill-opacity="0.6" stroke="#d946ef" stroke-opacity="0.3" stroke-width="1" />
    <path d="M14 23L22 18L30 23L22 28L14 23Z M14 26L22 31L30 26L30 33L22 38L14 33L14 26Z" fill="#f472b6" />
    <text x="36" y="24" fill="#f472b6" class="mono-text" font-size="9" font-weight="bold">REPOSITÓRIOS</text>
    <text x="36" y="41" fill="#ffffff" class="mono-text" font-size="12" font-weight="bold">37+ Projetos</text>
  </g>

  <!-- Chip 3: Availability -->
  <g transform="translate(454, 178)">
    <rect width="195" height="54" rx="10" fill="#000000" fill-opacity="0.6" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="22" cy="28" r="7" stroke="#34d399" stroke-width="1.8" fill="none" />
    <path d="M19 28L21 30L25 26" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="36" y="24" fill="#34d399" class="mono-text" font-size="9" font-weight="bold">DISPONIBILIDADE</text>
    <text x="36" y="41" fill="#ffffff" class="mono-text" font-size="12" font-weight="bold">Freelance &amp; Contratos</text>
  </g>

  <!-- Chip 4: Role -->
  <g transform="translate(663, 178)">
    <rect width="201" height="54" rx="10" fill="#000000" fill-opacity="0.6" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1" />
    <path d="M18 24L14 28L18 32 M26 24L30 28L26 32 M23 22L21 34" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="36" y="24" fill="#c084fc" class="mono-text" font-size="9" font-weight="bold">ATUAÇÃO</text>
    <text x="36" y="41" fill="#ffffff" class="mono-text" font-size="12" font-weight="bold">Full Stack Dev</text>
  </g>
</svg>
