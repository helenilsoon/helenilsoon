<svg width="100%" height="auto" viewBox="0 0 420 146" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8b949e; }
      .tag-txt { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 600; fill: #93c5fd; }
      .category { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #60a5fa; letter-spacing: 0.5px; }
      .arrow { font-family: 'Fira Code', monospace; font-size: 12px; fill: #60a5fa; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="417" height="143" rx="14" fill="#0c0f17" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Ambient Light -->
  <circle cx="390" cy="25" r="40" fill="#3b82f6" fill-opacity="0.08" filter="url(#blueGlow)" />

  <!-- Vector Chain Link Icon -->
  <rect x="20" y="18" width="26" height="26" rx="6" fill="#1e3a5f" fill-opacity="0.7" stroke="#3b82f6" stroke-opacity="0.5" />
  <path d="M29 33L32 30C33.5 28.5 36 28.5 37.5 30C39 31.5 39 34 37.5 35.5L34.5 38.5C33 40 30.5 40 29 38.5" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" />
  <path d="M33 29L30 32C28.5 33.5 26 33.5 24.5 32C23 30.5 23 28 24.5 26.5L27.5 23.5C29 22 31.5 22 33 23.5" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" />

  <text x="54" y="30" class="category">SaaS LINK MANAGEMENT</text>
  <text x="54" y="42" class="arrow">lnki.pro ↗</text>

  <!-- Title -->
  <text x="20" y="70" class="card-title">Lnki.pro • Encurtador Inteligente</text>

  <!-- Description -->
  <text x="20" y="90" class="card-desc">Plataforma SaaS com gateway Caddy, terminação TLS,</text>
  <text x="20" y="105" class="card-desc">landing pixel art, Redis e containers Docker.</text>

  <!-- Chips -->
  <g transform="translate(20, 116)">
    <rect width="78" height="20" rx="5" fill="#1e3a5f" fill-opacity="0.5" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="39" y="13.5" text-anchor="middle" class="tag-txt">Go (Golang)</text>
  </g>
  <g transform="translate(104, 116)">
    <rect width="58" height="20" rx="5" fill="#1e3a5f" fill-opacity="0.5" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="29" y="13.5" text-anchor="middle" class="tag-txt">Redis</text>
  </g>
  <g transform="translate(168, 116)">
    <rect width="66" height="20" rx="5" fill="#1e3a5f" fill-opacity="0.5" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="33" y="13.5" text-anchor="middle" class="tag-txt">Docker</text>
  </g>
</svg>
