<svg width="100%" height="auto" viewBox="0 0 420 146" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7" />
    </linearGradient>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .tag-txt { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 600; fill: #93c5fd; }
      .category { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #60a5fa; letter-spacing: 0.5px; }
      .arrow { font-family: 'Fira Code', monospace; font-size: 11.5px; fill: #60a5fa; font-weight: bold; }

      @keyframes float3D {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(2deg); }
      }
      @keyframes spin3D {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .holo-3d {
        animation: float3D 3.2s ease-in-out infinite;
        transform-origin: 375px 42px;
      }
      .spin-ring {
        animation: spin3D 7s linear infinite;
        transform-origin: 375px 42px;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="417" height="143" rx="14" fill="#080c14" stroke="url(#cardBorder)" stroke-width="1.4" />

  <!-- Ambient Light -->
  <circle cx="375" cy="42" r="35" fill="#3b82f6" fill-opacity="0.08" filter="url(#blueGlow)" />

  <!-- Vector Chain Link Icon Left -->
  <rect x="20" y="18" width="28" height="28" rx="7" fill="#1e3a5f" fill-opacity="0.7" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.2" />
  <path d="M29 33L32 30C33.5 28.5 36 28.5 37.5 30C39 31.5 39 34 37.5 35.5L34.5 38.5C33 40 30.5 40 29 38.5" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" />
  <path d="M33 29L30 32C28.5 33.5 26 33.5 24.5 32C23 30.5 23 28 24.5 26.5L27.5 23.5C29 22 31.5 22 33 23.5" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" />

  <text x="56" y="30" class="category">SaaS LINK MANAGEMENT</text>
  <text x="56" y="42" class="arrow">lnki.pro ↗</text>

  <!-- ================= 3D HOLOGRAPHIC NETWORK PRISM (TOP RIGHT) ================= -->
  <!-- Anel Orbital 3D -->
  <g class="spin-ring">
    <ellipse cx="375" cy="42" rx="27" ry="10" stroke="#60a5fa" stroke-width="1" stroke-dasharray="6 3 2 3" stroke-opacity="0.6" fill="none" filter="url(#blueGlow)" />
    <circle cx="402" cy="42" r="2.2" fill="#38bdf8" />
  </g>

  <!-- Prisma Isométrico 3D (Hub de Conexões) -->
  <g class="holo-3d">
    <!-- Top Face -->
    <polygon points="375,28 390,36 375,44 360,36" fill="#3b82f6" fill-opacity="0.75" stroke="#93c5fd" stroke-width="1" />
    <!-- Left Face -->
    <polygon points="360,36 375,44 375,58 360,50" fill="#1e3a5f" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1" />
    <!-- Right Face -->
    <polygon points="375,44 390,36 390,50 375,58" fill="#1d4ed8" fill-opacity="0.85" stroke="#60a5fa" stroke-width="1" />
    
    <!-- Link central 3D -->
    <circle cx="375" cy="36" r="3" fill="#67e8f9" filter="url(#blueGlow)" />
  </g>

  <!-- Title -->
  <text x="20" y="73" class="card-title">Lnki.pro • Encurtador Inteligente</text>

  <!-- Description -->
  <text x="20" y="93" class="card-desc">Plataforma SaaS com gateway Caddy, terminação TLS,</text>
  <text x="20" y="108" class="card-desc">landing pixel art, Redis e containers Docker.</text>

  <!-- Chips -->
  <g transform="translate(20, 117)">
    <rect width="78" height="20" rx="5" fill="#1e3a5f" fill-opacity="0.5" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="39" y="13.5" text-anchor="middle" class="tag-txt">Go (Golang)</text>
  </g>
  <g transform="translate(104, 117)">
    <rect width="58" height="20" rx="5" fill="#1e3a5f" fill-opacity="0.5" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="29" y="13.5" text-anchor="middle" class="tag-txt">Redis</text>
  </g>
  <g transform="translate(168, 117)">
    <rect width="66" height="20" rx="5" fill="#1e3a5f" fill-opacity="0.5" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="33" y="13.5" text-anchor="middle" class="tag-txt">Docker</text>
  </g>
</svg>
