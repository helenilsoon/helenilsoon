<svg width="100%" height="auto" viewBox="0 0 420 146" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8b949e; }
      .tag-txt { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 600; fill: #34d399; }
      .category { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #34d399; letter-spacing: 0.5px; }
      .arrow { font-family: 'Fira Code', monospace; font-size: 12px; fill: #34d399; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="417" height="143" rx="14" fill="#0c0f17" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Ambient Light -->
  <circle cx="390" cy="25" r="40" fill="#10b981" fill-opacity="0.08" filter="url(#emeraldGlow)" />

  <!-- Header line -->
  <!-- Vector Technical Icon (Ticket / Campaign Badge) -->
  <rect x="20" y="18" width="26" height="26" rx="6" fill="#064e3b" fill-opacity="0.7" stroke="#10b981" stroke-opacity="0.5" />
  <path d="M28 27H38M28 31H34M28 35H36" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" />
  
  <text x="54" y="30" class="category">PLATAFORMA SAAS</text>
  <text x="54" y="42" class="arrow">myrifa.com.br ↗</text>

  <!-- Title -->
  <text x="20" y="70" class="card-title">MyRifa • Campanhas &amp; Rifas Online</text>

  <!-- Description -->
  <text x="20" y="90" class="card-desc">Plataforma para campanhas com Pix automático, Supabase,</text>
  <text x="20" y="105" class="card-desc">Cloudflare R2 e gestão de cotas em tempo real.</text>

  <!-- Chips -->
  <g transform="translate(20, 116)">
    <rect width="66" height="20" rx="5" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-opacity="0.3" />
    <text x="33" y="13.5" text-anchor="middle" class="tag-txt">Next.js 14</text>
  </g>
  <g transform="translate(92, 116)">
    <rect width="66" height="20" rx="5" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-opacity="0.3" />
    <text x="33" y="13.5" text-anchor="middle" class="tag-txt">Supabase</text>
  </g>
  <g transform="translate(164, 116)">
    <rect width="90" height="20" rx="5" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-opacity="0.3" />
    <text x="45" y="13.5" text-anchor="middle" class="tag-txt">Pix Automático</text>
  </g>
</svg>
